name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing GitHub Release tag to attach APK to (e.g. v0.5.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Go mobile core tests
        run: go test -mod=vendor -tags=http2legacy ./internal/mobile ./internal/app

      - name: Locate Android NDK and build libtxlitecore.so (arm64-v8a)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi
          CC_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$CC_BIN"
          echo "Using NDK clang: $CC_BIN"

          OUT_DIR="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT_DIR"
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC="$CC_BIN" \
          CGO_LDFLAGS="-Wl,-z,max-page-size=16384" \
          go build -mod=vendor -tags=http2legacy -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o "$OUT_DIR/libtxlitecore.so" ./cmd/txlite-android

          # AGP jniLibs must contain only shared objects, not the cgo header.
          rm -f "$OUT_DIR/libtxlitecore.h"
          ls -lh "$OUT_DIR/libtxlitecore.so"

      - name: Download and verify official hev-socks5-tunnel.aar (v2.20.0)
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          AAR="android/app/libs/hev-socks5-tunnel.aar"
          curl -fsSL --retry 3 -o "$AAR" \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar"
          echo "ae8a2e96b80b4eccccd037805a4bb4a278090c89dbcae8bc6fcb7634e9a255b9  $AAR" | sha256sum -c -

      - name: Prepare Release signing keystore
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/txlite-release.p12"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "keystore_path=$KS" >> "$GITHUB_OUTPUT"
            echo "Loaded stable release keystore from secrets."
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret configured; falling back to debug keystore."
          fi

      - name: Build Android Release APK (arm64-v8a)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.sign.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk ../dist-android/txlite-android-arm64.apk
          (cd ../dist-android && sha256sum txlite-android-arm64.apk | tee txlite-android-arm64.apk.sha256)
          ls -lh ../dist-android/

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: txlite-android-arm64
          path: |
            dist-android/txlite-android-arm64.apk
            dist-android/txlite-android-arm64.apk.sha256

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag specified; skipping Release upload."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet; skipping Release upload."
            exit 0
          fi
          gh release upload "$TAG" dist-android/txlite-android-arm64.apk --clobber
          # Update SHA256SUMS on the release to include the Android APK checksum.
          if gh release download "$TAG" -p SHA256SUMS -O dist-android/SHA256SUMS 2>/dev/null; then
            grep -v 'txlite-android-arm64.apk' dist-android/SHA256SUMS > dist-android/SHA256SUMS.new || true
            cat dist-android/txlite-android-arm64.apk.sha256 >> dist-android/SHA256SUMS.new
            mv dist-android/SHA256SUMS.new dist-android/SHA256SUMS
            gh release upload "$TAG" dist-android/SHA256SUMS --clobber
          fi
