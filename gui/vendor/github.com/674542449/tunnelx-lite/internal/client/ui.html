<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tunnelX</title>
<style>*{box-sizing:border-box}body{font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;background:#f4f6fa;color:#1e293b;margin:0}main{max-width:940px;margin:48px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#64748b;margin:6px 0}section{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:24px;margin-top:22px}.badge{background:#e0f2fe;color:#0369a1;padding:5px 12px;border-radius:20px;font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:9px 16px;background:white;color:#334155;cursor:pointer}button.primary{background:#2563eb;color:white;border-color:#2563eb}button:hover{filter:brightness(.95)}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}.stat{background:#f8fafc;border-radius:8px;padding:16px}.stat b{font-size:23px;display:block}small{color:#64748b}.details{display:grid;grid-template-columns:130px 1fr;gap:8px}code{font-size:14px;color:#475569;word-break:break-all}#message{min-height:26px;color:#0369a1;margin-top:14px}footer{margin-top:20px;font-size:13px;color:#64748b}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}main{margin:24px auto}.details{grid-template-columns:1fr}}</style>
<main><header><div><h1>tunnelX</h1><p>Windows 应用代理</p></div><span class="badge" id="badge">正在读取状态</span></header>
<section><div class="row"><button class="primary" data-action="/api/proxy/enable">启用 Windows 系统代理</button><button data-action="/api/proxy/restore">恢复原来的代理设置</button><button data-action="/api/probe">检测连接</button></div><p>系统代理适用于支持 Windows 代理设置的应用。其他应用可配置下面的 SOCKS5 或 HTTP 地址。</p><div id="message" role="status"></div><div class="grid"><div class="stat"><small>活动连接</small><b id="active">0</b></div><div class="stat"><small>下载</small><b id="down">0 B</b></div><div class="stat"><small>上传</small><b id="up">0 B</b></div><div class="stat"><small>H2 建连重试</small><b id="fallback">0</b></div></div></section>
<section><div class="details"><small>节点</small><code id="name"></code><small>SOCKS5</small><code id="socks"></code><small>HTTP 代理</small><code id="http"></code><small>隐私模式</small><span id="privacy"></span><small>最近 TCP 通道</small><code id="tcp"></code><small>传输通道</small><span>HTTP/2</span><small>已建立请求</small><code id="streams"></code><small>UDP 本地丢弃</small><span id="drops"></span><small>诊断记录</small><span id="logging"></span><small>日志目录</small><code id="logdir"></code></div></section>
<footer>SOCKS5 使用远端域名解析。应用自行直连的流量不在代理范围内。关闭程序时会恢复由它设置的系统代理。</footer><button style="margin-top:16px" data-action="/api/exit">退出 tunnelX</button></main>
<script nonce="__NONCE__">const csrf='__NONCE__';const el=id=>document.getElementById(id);const bytes=n=>{const units=['B','KiB','MiB','GiB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]};let changed=false;async function refresh(){try{const r=await fetch('/api/status');if(!r.ok)throw Error();const s=await r.json();el('badge').textContent=s.system_proxy?'系统代理已启用':'本地代理已就绪';el('active').textContent=s.active;el('down').textContent=bytes(s.downloaded);el('up').textContent=bytes(s.uploaded);el('fallback').textContent=s.h2_retries;el('name').textContent=s.name+' · '+s.server;el('socks').textContent=s.socks;el('http').textContent=s.http;el('privacy').textContent=s.privacy==='strict'?'严格模式 · '+(s.ech?'ECH 已接受':'等待握手验证'):'普通模式 · 外层域名可见';el('tcp').textContent=s.tcp_carrier?'HTTP/'+s.tcp_carrier:'等待应用连接';el('streams').textContent='HTTP/2: '+s.h2_streams;el('drops').textContent=s.udp_dropped;const l=s.logging||{};el('logging').textContent=l.enabled?'正在记录 · '+l.written_events+' 条 · 丢失 '+l.dropped_events+' 条 · 写入错误 '+l.io_errors+' 次':'未启用';el('logdir').textContent=l.directory||''}catch{el('badge').textContent='程序已停止'}}async function action(path,body){el('message').textContent='正在处理…';try{const r=await fetch(path,{method:'POST',headers:{'X-CSRF-Token':csrf,'Content-Type':'application/json'},body:body?JSON.stringify(body):null});if(!r.ok)throw Error(await r.text());el('message').textContent=path==='/api/probe'?'TLS 和公共服务连接成功。':path==='/api/exit'?'程序正在退出。':'设置已更新。';await refresh()}catch(e){el('message').textContent=e.message}}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));refresh();setInterval(refresh,1500);</script></html>
